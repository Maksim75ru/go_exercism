name: merge-open-prs

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: только показать очередь, ничего не мержить"
        type: boolean
        default: true
      merge_method:
        description: "Метод мержа"
        type: choice
        options: [squash, merge, rebase]
        default: squash
      delete_branch:
        description: "Удалять ветку после мержа"
        type: boolean
        default: true
      stop_on_error:
        description: "Останавливаться на первом сбое"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: merge-open-prs
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge PRs (oldest first)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
          MERGE_METHOD: ${{ inputs.merge_method }}
          DELETE_BRANCH: ${{ inputs.delete_branch }}
          STOP_ON_ERROR: ${{ inputs.stop_on_error }}
        run: |
          set -uo pipefail

          gh pr list -R "$REPO" --state open --limit 300 \
            --json number,title,isDraft,createdAt,mergeable,headRefOid \
            --jq 'sort_by(.createdAt)
                  | map(select(.isDraft == false))
                  | .[] | [.number, .mergeable, .headRefOid, .title] | @tsv' \
            > /tmp/prs.tsv

          if [ ! -s /tmp/prs.tsv ]; then
            echo "Открытых PR нет"
            exit 0
          fi

          failed=0
          while IFS=$'\t' read -r num mergeable sha title; do
            echo "::group::PR #$num — $title"

            if [ "$mergeable" = "CONFLICTING" ]; then
              echo "::warning::#$num конфликтует с base — пропускаю"
              failed=$((failed + 1))
              echo "::endgroup::"
              [ "$STOP_ON_ERROR" = "true" ] && exit 1
              continue
            fi

            args=(--"$MERGE_METHOD" --match-head-commit "$sha")
            [ "$DELETE_BRANCH" = "true" ] && args+=(--delete-branch)

            if [ "$DRY_RUN" = "true" ]; then
              echo "dry-run: gh pr merge $num ${args[*]}"
            elif ! gh pr merge -R "$REPO" "$num" "${args[@]}"; then
              echo "::error::Не удалось смержить #$num"
              failed=$((failed + 1))
              echo "::endgroup::"
              [ "$STOP_ON_ERROR" = "true" ] && exit 1
              continue
            fi

            echo "::endgroup::"
          done < /tmp/prs.tsv

          if [ "$failed" -gt 0 ]; then
            echo "::error::Не смержено PR: $failed"
            exit 1
          fi
